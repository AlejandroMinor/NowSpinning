name: Arch package

# Builds the package from the release's tag and attaches it to the
# release, with a provenance attestation so it can be checked against
# this workflow:  gh attestation verify <file> -R AlejandroMinor/NowSpinning

on:
  release:
    types: [published]
  # Run by hand from the Actions tab, for a release that already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  package:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Install tools
        run: pacman -Syu --noconfirm --needed git github-cli pacman-contrib

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # The tag's PKGBUILD predates its own checksum, so pin the version
      # to the tag and compute the checksum here.
      - name: Build
        working-directory: packaging/arch
        run: |
          useradd -m builder
          chown -R builder .
          sed -i "s/^pkgver=.*/pkgver=${TAG#v}/; s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sudo -u builder updpkgsums
          sudo -u builder makepkg --nodeps

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: packaging/arch/*.pkg.tar.zst

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" packaging/arch/*.pkg.tar.zst --clobber -R "$GITHUB_REPOSITORY"
